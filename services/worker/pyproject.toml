[project]
name = "rahbar-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rahbar-agent"]

[project.scripts]
rahbar-worker = "rahbar_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rahbar_worker"]
