[project]
name = "rahbar-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "rahbar-agent",
  "rahbar-worker",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
  "sentry-sdk>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rahbar_api"]
