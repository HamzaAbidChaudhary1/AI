[project]
name = "rahbar"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["services/agent", "services/api", "services/worker"]

[tool.uv.sources]
rahbar-agent = { workspace = true }
rahbar-api = { workspace = true }
rahbar-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["services/agent/tests", "services/api/tests", "services/worker/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["S603", "S105", "S106"]
"**/tests/**" = ["S105", "S106", "S108", "S603"]
